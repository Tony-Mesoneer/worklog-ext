name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra version package.json khớp manifest.json
        run: node scripts/check-version-sync.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Đóng gói zip
        id: pack
        run: node scripts/pack.mjs --github-output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}-${{ github.run_number }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
