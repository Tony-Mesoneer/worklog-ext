name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra version package.json khớp manifest.json
        run: node scripts/check-version-sync.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx vite build

      - name: Build Firefox
        run: npx vite build
        env:
          TARGET: firefox

      - name: Đóng gói zip
        id: pack
        run: |
          node scripts/pack.mjs --github-output
          node scripts/pack.mjs --target firefox

      - uses: actions/upload-artifact@v7
        with:
          name: worklog-ext-${{ github.run_number }}
          path: release/*.zip
          if-no-files-found: error
