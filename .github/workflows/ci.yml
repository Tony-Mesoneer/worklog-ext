name: CI

# CHỈ `pull_request`, không có `push`. Trước đây có cả hai và mọi lần push đều
# chạy CI HAI LẦN: event `push` và event `pull_request` sinh ra hai run, và
# concurrency group không huỷ nhau được vì github.ref khác nhau
# (`refs/heads/feat/x` so với `refs/pull/1/merge`).
#
# Bỏ `push` chứ không bỏ `pull_request` vì `pull_request` là cái kiểm CÓ GIÁ TRỊ
# HƠN: nó build trên merge commit (main + branch), nên bắt được xung đột nghĩa
# khi main đã đi tiếp trong lúc PR nằm chờ. Build riêng branch thì không thấy.
#
# main KHÔNG cần CI riêng: mọi commit tới main đều qua PR (đã kiểm ở trên), và
# release.yml tự chạy lại typecheck/test/build/lint trước khi publish. Giữ
# `push: main` chỉ là chạy lại y nguyên công việc đó lần thứ hai.
#
# Đánh đổi: push một branch mà CHƯA mở PR thì không có CI. Mở PR, hoặc chạy tay
# bằng workflow_dispatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra version package.json khớp manifest.json
        run: node scripts/check-version-sync.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx vite build

      - name: Build Firefox
        run: npx vite build
        env:
          TARGET: firefox

      - name: Kiểm manifest Firefox theo luật AMO
        # web-ext lint exit 0 khi chỉ có warning, 1 khi có error — nên đây là
        # cổng chặn ĐÚNG mức: error thì fail, warning vẫn hiện trong log.
        # Hai warning đã biết và cố ý: UNSAFE_VAR_ASSIGNMENT là innerHTML trong
        # react-dom (không phải code của repo), và KEY_FIREFOX_ANDROID_… là do
        # KHÔNG khai gecko_android — Firefox Android không có sidebar nên bề mặt
        # chính của extension không tồn tại ở đó.
        run: npm run lint:firefox

      - name: Đóng gói zip
        id: pack
        run: |
          node scripts/pack.mjs --github-output
          node scripts/pack.mjs --target firefox

      - uses: actions/upload-artifact@v7
        with:
          name: worklog-ext-${{ github.run_number }}
          path: release/*.zip
          if-no-files-found: error
