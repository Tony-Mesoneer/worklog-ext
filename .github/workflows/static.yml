# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Được auto-version.yml gọi NGAY SAU khi nó bump và tag. Bắt buộc phải gọi
  # trực tiếp: commit `chore(release):` do job đó push đi bằng GITHUB_TOKEN, mà
  # push bằng token mặc định KHÔNG kích hoạt workflow khác — nên trigger `push`
  # ở trên không bao giờ thấy nó. Thiếu đường này thì landing page chỉ bắt kịp
  # version ở lần merge thường tiếp theo, tức luôn trễ một nhịp đúng vào lúc
  # release. Đây cùng là lý do auto-version phải `uses:` release.yml.
  workflow_call:
    inputs:
      ref:
        description: 'Ref để deploy (vd: v0.10.0). Bỏ trống thì lấy ref của event.'
        required: false
        type: string

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref để deploy lại (vd: v0.10.0). Bỏ trống thì lấy main.'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Khi được auto-version gọi, `github.ref` vẫn trỏ commit merge TRƯỚC
          # khi bump — deploy nó là publish lại đúng version cũ. Tag vừa tạo mới
          # là thứ chứa docs/index.html đã bump.
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `docs`, KHÔNG phải `.`: với `path: '.'` thì gốc site là gốc repo, mà
          # gốc repo không có index.html — nên https://…/worklog-ext/ trả 404 và
          # landing page chỉ tới được ở /docs/. Một trang quảng cáo mà URL hiển
          # nhiên lại 404 thì coi như không tồn tại.
          #
          # Trỏ vào `docs` thì gốc site CHÍNH LÀ docs/index.html. Kèm theo đó là
          # không còn publish cả cây source lên làm website nữa.
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
