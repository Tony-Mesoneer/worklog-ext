name: Installers

# Gói "thả vào Documents/Worklog Extension" cho macOS (.dmg) và Windows (.exe),
# kèm kiểm thử thật trên runner của từng hệ điều hành.
#
# Chỉ được gọi từ workflow khác (ci.yml, release.yml). Đầu vào là artifact mà
# job build đã upload, trong đó PHẢI có `worklog-ext-<version>-windows.zip` (xem
# scripts/pack.mjs --target windows). Cả dmg lẫn exe đều đóng từ CHÍNH zip đó
# chứ không build lại, nên ba gói luôn cùng nội dung.
#
# Đầu ra: artifact `<artifact>-macos` (.dmg) và `<artifact>-windows` (.exe).

on:
  workflow_call:
    inputs:
      artifact:
        description: 'Tên artifact chứa worklog-ext-<version>-windows.zip'
        required: true
        type: string
      version:
        description: 'Version không có chữ v (vd: 0.13.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: Đóng .dmg (macOS)
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: installer/macos

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: release

      - name: Tạo dmg
        # Trong dmg: thư mục `Worklog Extension` + một file hướng dẫn. KHÔNG có
        # symlink tới ~/Documents như kiểu symlink /Applications của dmg cài app:
        # symlink chỉ chứa đường dẫn tuyệt đối, mà Documents nằm dưới thư mục nhà
        # của TỪNG người (/Users/<tên>) — không có đích nào đúng cho mọi máy.
        # Người dùng kéo vào "Documents" ở thanh bên của Finder.
        run: |
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          unzip -q "release/worklog-ext-$VERSION-windows.zip" -d "$stage"
          cp installer/macos/how-to-install.txt "$stage/Cách cài - How to install.txt"
          hdiutil create \
            -volname "Worklog $VERSION" \
            -srcfolder "$stage" \
            -fs HFS+ -format UDZO -ov \
            "release/worklog-ext-$VERSION.dmg"

      - name: Kiểm dmg mount được và chứa đúng extension
        run: |
          mnt="$RUNNER_TEMP/mnt"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "release/worklog-ext-$VERSION.dmg"
          trap 'hdiutil detach "$mnt"' EXIT
          ls -la "$mnt" "$mnt/Worklog Extension"
          grep -q "\"version\": *\"$VERSION\"" "$mnt/Worklog Extension/manifest.json"
          grep -q '"key"' "$mnt/Worklog Extension/manifest.json"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}-macos
          path: release/worklog-ext-${{ inputs.version }}.dmg
          if-no-files-found: error

  windows:
    name: Đóng .exe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: installer/windows

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: release

      - name: Biên dịch exe
        # csc.exe của .NET Framework 4.x có sẵn trên mọi Windows 10/11 và trên
        # runner — không tải gì từ ngoài. Nó chỉ hiểu tới C# 5. /codepage:65001
        # vì source có tiếng Việt mà không có BOM. Không ký số (xem README).
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $zip = "release\worklog-ext-$env:VERSION-windows.zip"
          $exe = "release\worklog-ext-$env:VERSION-windows.exe"
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ `
            "/out:$exe" "/resource:$zip,payload.zip" `
            /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            /reference:System.Windows.Forms.dll `
            installer\windows\WorklogInstaller.cs
          if ($LASTEXITCODE -ne 0) { throw "csc thất bại ($LASTEXITCODE)" }
          Get-Item $exe

      - name: Kiểm exe trên Windows thật
        # Chạy /quiet (không hộp thoại — runner không có desktop để bấm OK) qua
        # bốn tình huống: cài mới, cập nhật đè phải dọn file cũ, thư mục trùng
        # tên không phải của mình thì KHÔNG được xoá, và zip Windows giải nén
        # vào Documents ra đúng chỗ.
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "release\worklog-ext-$env:VERSION-windows.exe").Path
          $zip = (Resolve-Path "release\worklog-ext-$env:VERSION-windows.zip").Path
          $docs = [Environment]::GetFolderPath('MyDocuments')
          $target = Join-Path $docs 'Worklog Extension'
          Write-Host "Documents: $docs"

          function Run-Installer {
            $p = Start-Process -FilePath $exe -ArgumentList '/quiet' -Wait -PassThru `
              -RedirectStandardError "$env:RUNNER_TEMP\installer-stderr.txt"
            # Write-Host chứ không để trần: output trần của function PowerShell
            # bị gộp vào giá trị trả về, $code sẽ thành mảng.
            Get-Content "$env:RUNNER_TEMP\installer-stderr.txt" -ErrorAction SilentlyContinue | Write-Host
            return $p.ExitCode
          }
          function Assert-Installed {
            $manifest = Get-Content (Join-Path $target 'manifest.json') -Raw | ConvertFrom-Json
            if ($manifest.version -ne $env:VERSION) { throw "version $($manifest.version) != $env:VERSION" }
            if (-not $manifest.key) { throw 'manifest thiếu key' }
          }

          # 1. Cài mới
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $code = Run-Installer
          if ($code -ne 0) { throw "cài mới: exit $code" }
          Assert-Installed

          # 2. Cập nhật đè: file của bản cũ phải biến mất
          $stale = Join-Path $target 'assets\stale-from-old-build.js'
          New-Item -ItemType File -Force $stale | Out-Null
          Set-ItemProperty $stale -Name IsReadOnly -Value $true
          $code = Run-Installer
          if ($code -ne 0) { throw "cập nhật: exit $code" }
          if (Test-Path $stale) { throw 'file cũ không được dọn' }
          Assert-Installed

          # 3. Thư mục trùng tên không phải của extension: không đụng vào
          Remove-Item $target -Recurse -Force
          New-Item -ItemType Directory $target | Out-Null
          Set-Content (Join-Path $target 'note.txt') 'của người dùng'
          $code = Run-Installer
          if ($code -ne 1) { throw "thư mục lạ: mong exit 1, nhận $code" }
          if (-not (Test-Path (Join-Path $target 'note.txt'))) { throw 'đã xoá thư mục của người dùng' }

          # 4. Zip Windows giải nén vào Documents ra đúng Documents\Worklog Extension
          Remove-Item $target -Recurse -Force
          Expand-Archive -Path $zip -DestinationPath $docs
          Assert-Installed
          Remove-Item $target -Recurse -Force
          Write-Host 'OK'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact }}-windows
          path: release/worklog-ext-${{ inputs.version }}-windows.exe
          if-no-files-found: error
