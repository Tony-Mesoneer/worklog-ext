name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag để build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag để build lại (vd: v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build và publish zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Trigger push tag không có inputs, nên rơi về github.ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra tag khớp version trong manifest
        run: node scripts/check-version-sync.mjs --tag "${{ inputs.tag || github.ref_name }}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx vite build

      - name: Build Firefox
        run: npx vite build
        env:
          TARGET: firefox

      - name: Kiểm manifest Firefox theo luật AMO
        # web-ext lint exit 0 khi chỉ có warning, 1 khi có error — nên đây là
        # cổng chặn ĐÚNG mức: error thì fail, warning vẫn hiện trong log.
        # Hai warning đã biết và cố ý: UNSAFE_VAR_ASSIGNMENT là innerHTML trong
        # react-dom (không phải code của repo), và KEY_FIREFOX_ANDROID_… là do
        # KHÔNG khai gecko_android — Firefox Android không có sidebar nên bề mặt
        # chính của extension không tồn tại ở đó.
        run: npm run lint:firefox

      - name: Đóng gói zip
        id: pack
        run: |
          node scripts/pack.mjs --github-output
          node scripts/pack.mjs --target firefox

      - uses: actions/upload-artifact@v7
        with:
          name: worklog-ext-${{ inputs.tag || github.ref_name }}
          path: release/*.zip
          if-no-files-found: error

      # Sign qua AMO để bản Firefox cài được LÂU DÀI: không sign thì chỉ load
      # được dạng "Temporary Add-on", mất khi đóng browser.
      #
      # Job tự bỏ qua khi chưa có secrets, và KHÔNG fail: người chưa cấu hình AMO
      # vẫn phải release được bản Chrome. `continue-on-error` cho chính bước sign
      # vì AMO thỉnh thoảng chậm hoặc từ chối vì lý do ngoài repo — một release bị
      # chặn hoàn toàn vì AMO là đánh đổi tệ hơn một release thiếu XPI.
      - name: Có credential AMO?
        id: amo
        run: |
          if [ -n "${{ secrets.AMO_JWT_ISSUER }}" ] && [ -n "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có AMO_JWT_ISSUER/AMO_JWT_SECRET — bỏ qua bước sign." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign XPI qua AMO
        if: steps.amo.outputs.ready == 'true'
        continue-on-error: true
        run: |
          npx web-ext sign \
            --source-dir dist-firefox \
            --artifacts-dir release \
            --channel unlisted \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}"
        env:
          NO_UPDATE_NOTIFIER: 1

      - name: Liệt kê file sẽ đính vào release
        id: files
        run: |
          ls -la release/
          # XPI chỉ có mặt khi bước sign chạy và thành công. Dùng glob trong
          # `files` của action nên không cần điều kiện gì thêm.
          echo "count=$(ls release/ | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Thứ tự có ý nghĩa: pickZip trong core/version lấy asset .zip ĐẦU TIÊN
          # có url, nên zip Chrome phải đứng trước — số đông dùng Chrome.
          # Thứ tự có ý nghĩa cho ZIP: pickZip trong core/version chọn asset theo
          # nền tảng, nhưng zip Chrome vẫn đứng trước vì số đông dùng Chrome.
          # `.xpi` không phải zip nên không ảnh hưởng phép chọn đó; dòng cuối
          # dùng glob vì XPI chỉ có khi bước sign chạy được.
          files: |
            ${{ steps.pack.outputs.zip }}
            release/worklog-ext-${{ steps.pack.outputs.version }}-firefox.zip
            release/*.xpi
