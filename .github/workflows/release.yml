name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag để build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag để build lại (vd: v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

# Ba job: `build` (zip + XPI) → `dmg` (trên runner macOS) → `publish`. Tách ra
# vì dmg cần hdiutil, chỉ có trên macOS.
jobs:
  build:
    name: Build và đóng gói zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Trigger push tag không có inputs, nên rơi về github.ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra tag khớp version trong manifest
        run: node scripts/check-version-sync.mjs --tag "${{ inputs.tag || github.ref_name }}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx vite build

      - name: Build Firefox
        run: npx vite build
        env:
          TARGET: firefox

      - name: Kiểm manifest Firefox theo luật AMO
        # web-ext lint exit 0 khi chỉ có warning, 1 khi có error — nên đây là
        # cổng chặn ĐÚNG mức: error thì fail, warning vẫn hiện trong log.
        # Hai warning đã biết và cố ý: UNSAFE_VAR_ASSIGNMENT là innerHTML trong
        # react-dom (không phải code của repo), và KEY_FIREFOX_ANDROID_… là do
        # KHÔNG khai gecko_android — Firefox Android không có sidebar nên bề mặt
        # chính của extension không tồn tại ở đó.
        run: npm run lint:firefox

      - name: Đóng gói zip
        id: pack
        run: |
          node scripts/pack.mjs --github-output
          node scripts/pack.mjs --target firefox
          node scripts/pack.mjs --target windows

      # Sign qua AMO để bản Firefox cài được LÂU DÀI: không sign thì chỉ load
      # được dạng "Temporary Add-on", mất khi đóng browser.
      #
      # Job tự bỏ qua khi chưa có secrets, và KHÔNG fail: người chưa cấu hình AMO
      # vẫn phải release được bản Chrome. `continue-on-error` cho chính bước sign
      # vì AMO thỉnh thoảng chậm hoặc từ chối vì lý do ngoài repo — một release bị
      # chặn hoàn toàn vì AMO là đánh đổi tệ hơn một release thiếu XPI.
      - name: Có credential AMO?
        id: amo
        run: |
          if [ -n "${{ secrets.AMO_JWT_ISSUER }}" ] && [ -n "${{ secrets.AMO_JWT_SECRET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có AMO_JWT_ISSUER/AMO_JWT_SECRET — bỏ qua bước sign." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign XPI qua AMO
        if: steps.amo.outputs.ready == 'true'
        continue-on-error: true
        run: |
          npx web-ext sign \
            --source-dir dist-firefox \
            --artifacts-dir release \
            --channel unlisted \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}"
        env:
          NO_UPDATE_NOTIFIER: 1

      # Upload SAU bước sign để XPI (nếu có) đi cùng sang job publish.
      - uses: actions/upload-artifact@v7
        with:
          name: worklog-ext-${{ inputs.tag || github.ref_name }}
          path: |
            release/*.zip
            release/*.xpi
          if-no-files-found: error

  dmg:
    name: Đóng dmg (macOS)
    needs: build
    uses: ./.github/workflows/dmg.yml
    permissions:
      contents: read
    with:
      artifact: worklog-ext-${{ inputs.tag || github.ref_name }}
      version: ${{ needs.build.outputs.version }}

  publish:
    name: Publish GitHub Release
    needs: [build, dmg]
    # Dmg là best-effort, cùng lý lẽ với bước sign AMO: một release bị chặn hoàn
    # toàn vì runner macOS trục trặc là đánh đổi tệ hơn một release thiếu dmg.
    # Check-update tự rơi về zip store khi release không có dmg (xem core/version
    # pickDownload).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Gộp artifact của build (`worklog-ext-<tag>`) và của dmg (`…-macos`)
          # vào cùng một thư mục.
          pattern: worklog-ext-${{ inputs.tag || github.ref_name }}*
          merge-multiple: true
          path: release

      - name: Liệt kê file sẽ đính vào release
        run: |
          ls -la release/
          if [ "${{ needs.dmg.result }}" != "success" ]; then
            echo "### ⚠️ Đóng dmg lỗi — release không có dmg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Thứ tự KHÔNG còn ý nghĩa cho check-update: pickDownload trong
          # core/version chọn theo hậu tố tên. Tên file thì CÓ: đổi hậu tố
          # (`.dmg`, `-windows.zip`, `-firefox.zip`) là phải sửa chỗ đó. Dmg/XPI
          # có thể vắng (xem `if` của job) — action chỉ cảnh báo file không khớp,
          # không fail.
          files: |
            release/worklog-ext-${{ env.VERSION }}.zip
            release/worklog-ext-${{ env.VERSION }}-firefox.zip
            release/worklog-ext-${{ env.VERSION }}-windows.zip
            release/worklog-ext-${{ env.VERSION }}.dmg
            release/*.xpi
