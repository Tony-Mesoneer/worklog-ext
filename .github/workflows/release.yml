name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag để build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag để build lại (vd: v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build và publish zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Trigger push tag không có inputs, nên rơi về github.ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra tag khớp version trong manifest
        run: node scripts/check-version-sync.mjs --tag "${{ inputs.tag || github.ref_name }}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Đóng gói zip
        id: pack
        run: node scripts/pack.mjs --github-output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip }}
