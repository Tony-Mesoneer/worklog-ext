name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag để build'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag để build lại (vd: v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build và publish zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Trigger push tag không có inputs, nên rơi về github.ref.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kiểm tra tag khớp version trong manifest
        run: node scripts/check-version-sync.mjs --tag "${{ inputs.tag || github.ref_name }}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx vite build

      - name: Build Firefox
        run: npx vite build
        env:
          TARGET: firefox

      - name: Đóng gói zip
        id: pack
        run: |
          node scripts/pack.mjs --github-output
          node scripts/pack.mjs --target firefox

      - uses: actions/upload-artifact@v7
        with:
          name: worklog-ext-${{ inputs.tag || github.ref_name }}
          path: release/*.zip
          if-no-files-found: error

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Thứ tự có ý nghĩa: pickZip trong core/version lấy asset .zip ĐẦU TIÊN
          # có url, nên zip Chrome phải đứng trước — số đông dùng Chrome.
          files: |
            ${{ steps.pack.outputs.zip }}
            release/worklog-ext-${{ steps.pack.outputs.version }}-firefox.zip
